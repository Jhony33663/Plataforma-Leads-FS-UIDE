<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <title>Inscripción Oficial UIDE 2026 - Nicol Romero</title>
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="advisor-standalone-page">
    <div class="app-container" style="max-width: 540px; margin: 20px auto; padding: 16px;">
        <div class="form-card" style="background: #ffffff; border-radius: 16px; padding: 24px; box-shadow: 0 8px 24px rgba(0,45,114,0.12); border: 1px solid #dbe2ea;">
            <div class="form-header-box" style="text-align: center; margin-bottom: 20px;">
                <span class="credential-badge-tag" style="background: rgba(234, 170, 0, 0.16); border: 1px solid #EAAA00; color: #b47d00; font-size: 10px; font-weight: 800; padding: 3px 10px; border-radius: 9999px; text-transform: uppercase;">
                    POWERED BY ARIZONA STATE UNIVERSITY
                </span>
                <h2 style="font-family: 'Poppins', sans-serif; font-size: 22px; font-weight: 800; color: #002d72; margin: 10px 0 4px 0;">SOLICITA INFORMACIÓN</h2>
                <div class="form-advisor-endpoint-badge">
                    <span>👤 Asesor: <strong>Nicol Romero (ADV-06)</strong></span>
                    <span class="endpoint-divider">•</span>
                    <span>Sede: Loja</span>
                </div>
            </div>

            <form accept-charset="UTF-8"
                  action="https://go.uide.edu.ec/l/455762/2026-09-08/8d64j1"
                  method="post"
                  id="pardot-form"
                  target="_top">

                <!-- Tracking y CRM Pardot -->
                <input type="hidden" id="utm_source" name="utm_source" value="prospeccion">
                <input type="hidden" id="utm_medium" name="utm_medium" value="formulario_asesor">
                <input type="hidden" id="utm_term" name="utm_term" value="ADV-06_Nicol Romero">
                <input type="hidden" id="utm_content" name="utm_content" value="general">
                <input type="hidden" id="utm_campaign" name="utm_campaign" value="PROSPECCION_CHARLA_FS_GENERAL_2026">
                <input type="hidden" id="gclid" name="gclid" value="">
                <input type="hidden" id="periodo" name="periodo" value="2026-2 Q Pregrado">
                <input type="hidden" id="esc_pgm" name="esc_pgm" value="">
                <input type="hidden" id="c_lead" name="c_lead" value="Prospeccion">
                <input type="hidden" id="origen" name="origen" value="Charla FS">
                <input type="hidden" id="carrera_hidden" name="carrera" value="">
                <input type="hidden" id="programa_hidden" name="programa" value="">
                <input type="hidden" id="form_endpoint" name="form_endpoint" value="https://go.uide.edu.ec/l/455762/2026-09-08/8d64j1">

                <!-- Datos del Asesor Asignado -->
                <input type="hidden" id="asesor_id" name="asesor_id" value="ADV-06">
                <input type="hidden" id="asesor_nombre" name="asesor_nombre" value="Nicol Romero">
                <input type="hidden" id="asesor_email" name="asesor_email" value="asesoreducativoloja@uide.edu.ec">
                <input type="hidden" id="asesor_sede" name="asesor_sede" value="Loja">

                <!-- Campos de Contacto -->
                <div class="form-group" style="margin-bottom: 14px;">
                    <label class="field-label" for="f_name">Nombres *</label>
                    <input type="text" id="f_name" name="f_name" class="form-input" placeholder="Tus nombres" required>
                </div>

                <div class="form-group" style="margin-bottom: 14px;">
                    <label class="field-label" for="l_name">Apellidos *</label>
                    <input type="text" id="l_name" name="l_name" class="form-input" placeholder="Tus apellidos" required>
                </div>

                <div class="form-group" style="margin-bottom: 14px;">
                    <label class="field-label" for="email">Correo Electrónico *</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="tu.correo@ejemplo.com" required>
                </div>

                <div class="form-group" style="margin-bottom: 14px;">
                    <label class="field-label" for="mobile">Celular / WhatsApp *</label>
                    <div style="display: flex; gap: 8px;">
                        <select id="country_code" class="form-select" style="width: 100px;">
                            <option value="+593" selected>🇪🇨 +593</option>
                            <option value="+1">🇺🇸 +1</option>
                            <option value="+57">🇨🇴 +57</option>
                            <option value="+51">🇵🇪 +51</option>
                        </select>
                        <input type="tel" id="mobile" name="mobile" class="form-input" placeholder="0991234567" required style="flex: 1;">
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 14px;">
                    <label class="field-label" for="cedula">Cédula de Identidad *</label>
                    <input type="text" id="cedula" name="cedula" class="form-input" placeholder="10 dígitos" maxlength="10" required>
                </div>

                <div class="form-group" style="margin-bottom: 14px;">
                    <label class="field-label" for="colegio_origen">Colegio de Procedencia</label>
                    <input type="text" id="colegio_origen" name="colegio_origen" class="form-input" placeholder="Nombre de tu colegio">
                </div>

                <!-- Cascada Académica UIDE -->
                <div class="form-group" style="margin-bottom: 14px;">
                    <label class="field-label" for="sede">Sede Académica *</label>
                    <select id="sede" name="sede" class="form-select" required>
                        <option value="">Seleccione Sede</option>
                        <option value="Quito">Quito</option>
                        <option value="Guayaquil">Guayaquil</option>
                        <option value="Loja">Loja</option>
                        <option value="Distancia">Distancia / Online</option>
                    </select>
                </div>

                <div class="form-group" style="margin-bottom: 14px;">
                    <label class="field-label" for="tp_pgm">Tipo de Programa *</label>
                    <select id="tp_pgm" name="tp_pgm" class="form-select" disabled required>
                        <option value="">Tipo de programa *</option>
                    </select>
                </div>

                <div class="form-group" id="modalidad_container" style="display: none; margin-bottom: 14px;">
                    <label class="field-label" for="modalidad_posgrado">Modalidad *</label>
                    <select id="modalidad_posgrado" name="modalidad" class="form-select">
                        <option value="">Seleccione modalidad *</option>
                    </select>
                </div>

                <div class="form-group" id="carrera_container" style="display: none; margin-bottom: 16px;">
                    <label class="field-label" for="carrera_select">Carrera de Interés *</label>
                    <select id="carrera_select" class="form-select" required>
                        <option value="">Selecciona tu programa *</option>
                    </select>
                </div>

                <!-- Consentimiento LOPDP -->
                <div class="form-group" style="margin-bottom: 18px; display: flex; align-items: flex-start; gap: 8px;">
                    <input type="checkbox" id="aut_data" name="aut_data" value="true" checked required style="margin-top: 3px;">
                    <label for="aut_data" style="font-size: 11px; color: #596275; line-height: 1.4;">
                        Autorizo a la Universidad Internacional del Ecuador (UIDE) el tratamiento de mis datos personales con fines de admisión y orientación académica conforme a la ley.
                    </label>
                </div>

                <button type="submit" class="btn-submit-lead" style="width: 100%; padding: 14px; background: linear-gradient(135deg, #EAAA00 0%, #d49900 100%); color: #002d72; font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 800; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 14px rgba(234,170,0,0.35);">
                    ENVIAR SOLICITUD DE INFORMACIÓN
                </button>
            </form>
        </div>
    </div>

    <script src="../js/leads-storage.js"></script>
    <script src="../js/campaigns-manager.js"></script>
    <script src="../js/uide-form-logic.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof UIDEForm !== 'undefined') {
                UIDEForm.init();
                UIDEForm.syncAdvisorData({"id":"ADV-06","slug":"nicol-romero","nombre":"Nicol Romero","email":"asesoreducativoloja@uide.edu.ec","telefono":"+593995197673","sede":"Loja","cargo":"Asesora Educativa","endpoint":"https://go.uide.edu.ec/l/455762/2026-09-08/8d64j1"});
            }
        });
    </script>
</body>
</html>
